name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"
  # GH49 — build d'une marque client (apps/desktop/brands/<brand>/) : l'installeur est fourni en
  # artefact du run, jamais publié en release de ce repo (le client héberge ses mises à jour, et
  # le nom des clients n'apparaît pas dans les releases publiques).
  workflow_dispatch:
    inputs:
      brand:
        description: "Marque (dossier apps/desktop/brands/<brand>)"
        required: true
        default: polenta

permissions:
  contents: write
  # GH154 — notes de version : lecture des issues fermées depuis la dernière release.
  issues: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Generate release notes
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GH158 — la version est déduite du tag (scripts/app-version.ts), package.json n'est plus
      # modifié : on vérifie seulement que le tag est une version X.Y.Z et qu'elle est bien retenue.
      - name: Check version from tag
        if: github.event_name == 'push'
        working-directory: apps/desktop
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME : attendu vX.Y.Z"
            exit 1
          fi
          BUILD_VERSION=$(pnpm exec tsx scripts/print-version.ts)
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "Version deduite ($BUILD_VERSION) differente du tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Package desktop app
        working-directory: apps/desktop
        env:
          POLENTA_BRAND: ${{ github.event_name == 'push' && 'polenta' || inputs.brand }}
        run: pnpm package

      - name: Upload brand installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ inputs.brand }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # GH26 — latest.yml + blockmap : requis par electron-updater (mise à jour auto).
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
          body_path: ${{ runner.temp }}/release-notes.md
