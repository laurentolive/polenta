name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"
  # GH49 — build d'une marque client (apps/desktop/brands/<brand>/) : l'installeur est fourni en
  # artefact du run, jamais publié en release de ce repo (le client héberge ses mises à jour, et
  # le nom des clients n'apparaît pas dans les releases publiques).
  workflow_dispatch:
    inputs:
      brand:
        description: "Marque (dossier apps/desktop/brands/<brand>)"
        required: true
        default: polenta

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION ne correspond pas a apps/desktop/package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Generate release notes
        if: github.event_name == 'push'
        shell: bash
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        working-directory: apps/desktop
        env:
          POLENTA_BRAND: ${{ github.event_name == 'push' && 'polenta' || inputs.brand }}
        run: pnpm package

      - name: Upload brand installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ inputs.brand }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # GH26 — latest.yml + blockmap : requis par electron-updater (mise à jour auto).
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
          body_path: ${{ runner.temp }}/release-notes.md
