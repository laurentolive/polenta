# GH45 — une instance Forgejo (un client). Lancé par polenta-host avec
#   docker compose -p polenta-<nom> --env-file <instance>/instance.env -f <kit>/instance/docker-compose.yml
# Aucun port publié : seul le Caddy de l'hôte, relié au réseau polenta-<nom>, y accède.
services:
  forgejo:
    image: ${FORGE_IMAGE}:${FORGE_VERSION}
    container_name: forgejo-${INSTANCE_NAME}
    restart: unless-stopped
    env_file:
      - ${INSTANCE_DIR}/forgejo.env
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    volumes:
      - ${INSTANCE_DIR}/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # GH44 — client web Polenta de cette instance (image apps/desktop/Dockerfile.web). Actif quand
  # l'instance a un domaine web (WEB_DOMAIN) : polenta-host ajoute alors « --profile web » à toutes
  # ses commandes compose (`polenta-host instance web enable`). Connexion OIDC par la forge
  # ci-dessus ; configuration et secrets dans web.env (rendu par polenta-host, chmod 600).
  polenta-web:
    profiles: ["web"]
    image: ${POLENTA_WEB_IMAGE:-polenta-web}:${POLENTA_WEB_VERSION:-none}
    container_name: polenta-web-${INSTANCE_NAME}
    restart: unless-stopped
    env_file:
      - path: ${INSTANCE_DIR}/web.env
        required: false
    volumes:
      - ${INSTANCE_DIR}/web-data:/var/lib/polenta-web
    networks:
      - default
    depends_on:
      forgejo:
        condition: service_healthy

networks:
  default:
    name: polenta-${INSTANCE_NAME}
